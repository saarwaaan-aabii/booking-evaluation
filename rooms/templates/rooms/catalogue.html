<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Room catalogue</title>
</head>
<body>
    <main>
        <h1>Room catalogue</h1>
        <ul>
            {% for room in rooms %}
                <li>
                    <strong>{{ room.code }}</strong> —
                    {{ room.name }} —
                    {{ room.location.city }} —
                    {{ room.capacity }} seats
                </li>
            {% empty %}
                <li>No rooms available.</li>
            {% endfor %}
        </ul>
    </main>
</body>
</html>
